type.test=补充缺失测试或修正现有测试
type.build=影响构建系统或外部依赖的变更（示例范围：gulp、broccoli、npm）
type.ci=CI 配置文件和脚本的变更（示例范围：Travis、Circle、BrowserStack、SauceLabs）
type.chore=不修改 src 或测试文件的其他变更
type.revert=回滚之前的提交
